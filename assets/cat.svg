<svg xmlns="http://www.w3.org/2000/svg" width="300" height="250" viewBox="26 20 165 140">
<style>
.c{animation:bob 1s steps(1) infinite}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.p{animation:bat .6s steps(1) infinite}
@keyframes bat{0%{transform:translate(0,0)}50%{transform:translate(-3px,4px)}}
.y{animation:roll 1.2s steps(1) infinite}
@keyframes roll{0%{transform:translateX(0)}50%{transform:translateX(-2px)}}
.blink{opacity:0;animation:bl 4s steps(1) infinite}
@keyframes bl{0%{opacity:0}90%{opacity:1}95%{opacity:0}}
.note{opacity:0;animation:fl 3s linear infinite}
@keyframes fl{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}80%{opacity:.8}100%{opacity:0;transform:translate(6px,-28px)}}
</style>
<image class="y" href="data:image/png;base64," x="0" y="0" width="187" height="167" style="image-rendering:pixelated"/><image class="p" href="data:image/png;base64," x="0" y="0" width="187" height="167" style="image-rendering:pixelated"/>
<g class="c"><image class="" href="data:image/png;base64," x="0" y="0" width="187" height="167" style="image-rendering:pixelated"/>
<g class="blink" shape-rendering="crispEdges">
<rect x="117" y="66" width="19" height="22" fill="#fff"/><rect x="118" y="76" width="17" height="3" fill="#1b1b1f"/>
<rect x="143" y="81" width="19" height="23" fill="#fff"/><rect x="144" y="92" width="17" height="3" fill="#1b1b1f"/>
</g></g>
<g shape-rendering="crispEdges"><g class="note" style="animation-delay:0s"><rect x="163" y="52" width="2" height="9" fill="#8ab4f8"/><rect x="165" y="52" width="4" height="2" fill="#8ab4f8"/><rect x="160" y="59" width="4" height="4" fill="#8ab4f8"/></g><g class="note" style="animation-delay:1.5s"><rect x="174" y="52" width="2" height="9" fill="#8ab4f8"/><rect x="176" y="52" width="4" height="2" fill="#8ab4f8"/><rect x="171" y="59" width="4" height="4" fill="#8ab4f8"/></g></g>
</svg>